[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnembound"
version = "1.0.0"
description = "SOC benchmark generator for event-level provenance evaluation in multi-tenant agent memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aditya Jain" },
    { name = "Anmol Pandey" },
    { name = "Liang Chen" },
]
keywords = ["security", "llm-agents", "memory", "provenance", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/adi271213/mnembound"

[project.optional-dependencies]
test = ["pytest>=7"]
models = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mnembound*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
